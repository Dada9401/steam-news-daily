<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam 行业情报站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top right, #1b2838, #171a21); }
        .glass-card { background: rgba(42, 71, 94, 0.3); backdrop-filter: blur(10px); border: 1px solid rgba(102, 192, 244, 0.2); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .glass-card:hover { transform: translateY(-8px); border-color: #66c0f4; box-shadow: 0 10px 30px -10px rgba(102, 192, 244, 0.4); background: rgba(42, 71, 94, 0.5); }
        .steam-gradient { background: linear-gradient(90deg, #66c0f4, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="text-slate-200 min-h-screen">
    <div class="max-w-6xl mx-auto py-12 px-6">
        <header class="mb-16 text-center">
            <h1 class="text-6xl font-extrabold mb-4 tracking-tighter steam-gradient">STEAM TRENDS</h1>
            <div class="flex items-center justify-center space-x-4">
                <span class="h-[1px] w-12 bg-blue-500/30"></span>
                <p id="update-time" class="text-xs uppercase tracking-[0.3em] text-blue-400 font-semibold">Loading Intelligence...</p>
                <span class="h-[1px] w-12 bg-blue-500/30"></span>
            </div>
        </header>

        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
        <footer class="mt-20 border-t border-white/5 pt-8 text-center text-slate-500 text-sm">
            Powered by Gemini AI • Data from Steam Community
        </footer>
    </div>
</body>
</html>
