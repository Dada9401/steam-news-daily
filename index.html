<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Steam 今日动态</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .news-card:hover { transform: translateY(-5px); transition: all 0.3s; }
    </style>
</head>
<body class="bg-[#1b2838] text-[#c7d5e0] min-h-screen font-sans">
    <div class="max-w-5xl mx-auto py-12 px-6">
        <header class="flex justify-between items-end border-b border-blue-900/50 pb-8 mb-10">
            <div>
                <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-[#66c0f4] to-[#4facfe]">
                    Steam Daily
                </h1>
                <p class="mt-3 text-slate-400 tracking-widest uppercase text-sm">行业资讯 · 实时自动更新</p>
            </div>
            <div id="update-time" class="text-xs font-mono text-blue-500/80 bg-blue-500/10 px-3 py-1 rounded-full">
                Last Update: 2026-01-22
            </div>
        </header>

        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            </div>
    </div>
</body>
</html>
