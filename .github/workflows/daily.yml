name: Steam新闻自动更新

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间上午8点自动运行
  workflow_dispatch: # 允许你手动点击运行，方便现在测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: 安装 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: 安装依赖库
        run: pip install feedparser
        
      - name: 运行抓取脚本
        run: python fetch_news.py
        
      - name: 提交并推送更新
        run: |
          git config --global user.name "Github Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          git commit -m "自动更新新闻: $(date)" || echo "无需更新"
          git push
