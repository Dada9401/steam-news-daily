name: Steam新闻自动更新

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间上午8点自动运行
  workflow_dispatch: # 允许你手动点击运行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      # 这里就是你问的“具体位置”，我们在这里安装 requests 库
      - name: 安装必要的插件
        run: |
          pip install requests

      - name: 运行抓取脚本
        run: python fetch_news.py
        
      - name: 提交并推送更新到网页
        run: |
          git config --global user.name "Github Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          git commit -m "自动同步最新Steam精选资讯: $(date)" || exit 0
          git push
