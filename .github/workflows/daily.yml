name: Steam新闻自动更新

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 关键：增加下面这两行权限声明
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: 安装 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: 安装依赖库
        run: pip install feedparser
        
      - name: 运行抓取脚本
        run: python fetch_news.py
        
      - name: 提交并推送更新
        run: |
          git config --global user.name "Github Bot"
          git config --global user.email "bot@github.com"
          git add index.html
          # 如果内容没变，git commit 会报错，用 || exit 0 忽略它
          git commit -m "自动更新新闻: $(date)" || exit 0
          git push
